<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 54px;
        fill: #ffffff;
      }
      .subtitle {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 24px;
        fill: #94a3b8;
      }
      .tag {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 16px;
        fill: #38bdf8;
      }
      .pulse-circle {
        animation: pulse 3s infinite ease-in-out;
      }
      .wave-line {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: dash 5s linear infinite;
      }
      .float-node {
        animation: float 4s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.15); opacity: 0.9; }
      }
      @keyframes dash {
        to { stroke-dashoffset: 0; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Geometric Decorative Grid & Orbs -->
  <g opacity="0.15">
    <circle cx="150" cy="100" r="250" fill="url(#glow-grad)" />
    <circle cx="1050" cy="300" r="300" fill="url(#glow-grad)" />
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200" stroke="#ffffff" stroke-width="0.5" />
    <path d="M200 0 V400 M400 0 V400 M600 0 V400 M800 0 V400 M1000 0 V400" stroke="#ffffff" stroke-width="0.5" />
  </g>

  <!-- Dynamic Animated Graphic Components -->
  <!-- Dumbbell / Pulse Icon -->
  <g transform="translate(100, 150)">
    <!-- Dumbbell bar -->
    <rect x="20" y="45" width="80" height="10" rx="5" fill="url(#accent-grad)" />
    <!-- Weights left -->
    <rect x="10" y="25" width="12" height="50" rx="4" fill="#38bdf8" />
    <rect x="0" y="15" width="10" height="70" rx="4" fill="#818cf8" />
    <!-- Weights right -->
    <rect x="98" y="25" width="12" height="50" rx="4" fill="#38bdf8" />
    <rect x="110" y="15" width="10" height="70" rx="4" fill="#818cf8" />
    <circle cx="60" cy="50" r="45" fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.4" class="pulse-circle" />
  </g>

  <!-- Animated Heartbeat / Performance Wave -->
  <path d="M 250 200 L 320 200 L 340 140 L 360 250 L 385 110 L 410 230 L 430 180 L 450 200 L 550 200" 
        fill="none" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" 
        filter="url(#glow)" class="wave-line" />

  <!-- Text Header Content -->
  <g transform="translate(260, 130)">
    <text x="0" y="0" class="tag" letter-spacing="3">CURATED ECOSYSTEM &amp; PLATFORM DIRECTORY</text>
    <text x="0" y="55" class="title">Awesome Personal Trainer Platform</text>
    <text x="0" y="95" class="subtitle">SaaS Products • Open-Source Repos • Coaching CRMs • Fitness APIs</text>
  </g>

  <!-- Feature Badges Inside Banner -->
  <g transform="translate(260, 275)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#38bdf8" />
      <text x="36" y="24" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">10+ SaaS Leader Metrics</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(200, 0)">
      <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#818cf8" />
      <text x="36" y="24" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Open-Source Repos</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(400, 0)">
      <rect width="210" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#c084fc" />
      <text x="36" y="24" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Market Size &amp; Pricing Analysis</text>
    </g>
  </g>
</svg>
